# nginx for tools/validate/mtls-real.sh: a client certificate is required and
# verified against the fixture CA (the client sends the intermediate itself).
# The script substitutes the ports: @P12@ HTTP/2 + TLS 1.2, @P13@ HTTP/2 +
# TLS 1.3, @P1H@ HTTP/1.1 + TLS 1.3.
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr info;
events {}
http {
  access_log /dev/stdout;
  ssl_certificate /certs/server.crt;
  ssl_certificate_key /certs/server.key;
  ssl_client_certificate /certs/ca.crt;
  ssl_verify_client on;
  ssl_verify_depth 3;
  default_type text/plain;

  server {
    listen 127.0.0.1:@P12@ ssl;
    http2 on;
    ssl_protocols TLSv1.2;
    location / { return 200 "dn=$ssl_client_s_dn verify=$ssl_client_verify proto=$server_protocol tls=$ssl_protocol\n"; }
  }
  server {
    listen 127.0.0.1:@P13@ ssl;
    http2 on;
    ssl_protocols TLSv1.3;
    location / { return 200 "dn=$ssl_client_s_dn verify=$ssl_client_verify proto=$server_protocol tls=$ssl_protocol\n"; }
  }
  server {
    listen 127.0.0.1:@P1H@ ssl;
    ssl_protocols TLSv1.3;
    location / { return 200 "dn=$ssl_client_s_dn verify=$ssl_client_verify proto=$server_protocol tls=$ssl_protocol\n"; }
  }
}
