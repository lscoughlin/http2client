# Apache httpd 2.4 for tools/validate/mtls-real.sh: mod_ssl with
# SSLVerifyClient require against the fixture CA, the client subject echoed by
# an SSI page.  The script substitutes the ports: @P12@ HTTP/2 + TLS 1.2,
# @P13@ HTTP/2 + TLS 1.3, @P1H@ HTTP/1.1 + TLS 1.3.
ServerRoot "/usr/local/apache2"
ServerName localhost
PidFile /tmp/httpd.pid
ErrorLog /proc/self/fd/2
LogLevel warn
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule include_module modules/mod_include.so
LoadModule filter_module modules/mod_filter.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule http2_module modules/mod_http2.so
User daemon
Group daemon
DocumentRoot "/conf/htdocs"
<Directory "/conf/htdocs">
  Options +Includes
  AddType text/plain .shtml
  AddOutputFilter INCLUDES .shtml
  DirectoryIndex index.shtml
  Require all granted
</Directory>
SSLSessionCache shmcb:/tmp/ssl_scache(512000)
SSLCertificateFile /certs/server.crt
SSLCertificateKeyFile /certs/server.key
SSLCACertificateFile /certs/ca.crt
SSLVerifyClient require
SSLVerifyDepth 3
SSLOptions +StdEnvVars

Listen 127.0.0.1:@P12@
Listen 127.0.0.1:@P13@
Listen 127.0.0.1:@P1H@

<VirtualHost 127.0.0.1:@P12@>
  SSLEngine on
  SSLProtocol -all +TLSv1.2
  Protocols h2 http/1.1
</VirtualHost>
<VirtualHost 127.0.0.1:@P13@>
  SSLEngine on
  SSLProtocol -all +TLSv1.3
  Protocols h2 http/1.1
</VirtualHost>
<VirtualHost 127.0.0.1:@P1H@>
  SSLEngine on
  SSLProtocol -all +TLSv1.3
  Protocols http/1.1
</VirtualHost>
